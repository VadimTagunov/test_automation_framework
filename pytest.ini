[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers --alluredir=allure-results
markers =
    ui: UI/E2E tests that drive the browser via Selenium
    api: API-level tests that call the REST API directly via requests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
